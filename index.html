<!-- ════════════ MOTEUR DSP (identique à SynthEngine.kt / kayamb_engine.py) ════════════
     Dans un <script type="text/plain"> : non exécuté ici. Injecté tel quel dans
     l'AudioWorklet (thread audio) et extrait par tools/web_engine_test.js pour
     vérifier que le code EXPÉDIÉ est bien le code TESTÉ. -->
<script id="dsp-core" type="text/plain">
function makeGaussian(){
  let has=false, g2=0;
  return function(){
    if(has){has=false;return g2;}
    const u1=Math.max(1e-12,Math.random()), u2=Math.random();
    const r=Math.sqrt(-2*Math.log(u1)), t=2*Math.PI*u2;
    g2=r*Math.sin(t); has=true; return r*Math.cos(t);
  };
}
function Reson(SR,freq,radius,amp){
  const w=2*Math.PI*freq/SR;
  this.a1=-2*radius*Math.cos(w); this.a2=radius*radius; this.amp=amp;
  this.y1=0;this.y2=0;this.x1=0;this.x2=0;
}
Reson.prototype.process=function(x){
  const y=x-this.x2-this.a1*this.y1-this.a2*this.y2;
  this.x2=this.x1; this.x1=x; this.y2=this.y1; this.y1=y;
  return this.amp*y;
};
function Comb(size,fb,damp){this.buf=new Float32Array(size);this.i=0;this.fb=fb;this.d1=damp;this.d2=1-damp;this.store=0;}
Comb.prototype.process=function(x){const o=this.buf[this.i];this.store=o*this.d2+this.store*this.d1;this.buf[this.i]=x+this.store*this.fb;if(++this.i>=this.buf.length)this.i=0;return o;};
function Allpass(size,fb){this.buf=new Float32Array(size);this.i=0;this.fb=fb;}
Allpass.prototype.process=function(x){const b=this.buf[this.i];const o=-x+b;this.buf[this.i]=x+b*this.fb;if(++this.i>=this.buf.length)this.i=0;return o;};
function Freeverb(SR){
  const comb=[1116,1188,1277,1356,1422,1491,1557,1617], allp=[556,441,341,225], spread=23;
  const sc=SR/44100, fb=0.72*0.28+0.7, damp=0.28*0.4;
  const sz=function(n){return Math.max(1,Math.round(n*sc));};
  this.gain=0.015; this.last=0;
  this.cL=comb.map(function(n){return new Comb(sz(n),fb,damp);});
  this.cR=comb.map(function(n){return new Comb(sz(n+spread),fb,damp);});
  this.aL=allp.map(function(n){return new Allpass(sz(n),0.5);});
  this.aR=allp.map(function(n){return new Allpass(sz(n+spread),0.5);});
}
Freeverb.prototype.processL=function(mono){this.last=mono*this.gain;let l=0;for(let i=0;i<this.cL.length;i++)l+=this.cL[i].process(this.last);for(let i=0;i<this.aL.length;i++)l=this.aL[i].process(l);return l;};
Freeverb.prototype.processR=function(){const inp=this.last;let r=0;for(let i=0;i<this.cR.length;i++)r+=this.cR[i].process(inp);for(let i=0;i<this.aR.length;i++)r=this.aR[i].process(r);return r;};

function createKayambDSP(SR){
  const MASTER=1.0e-5;
  let spec=null, resos=[];
  let systemE=0, soundLvl=0, bead=0, lp=0, shakeAccum=0, tilt=0, reverbMix=0.18;
  const gauss=makeGaussian();
  const rev=new Freeverb(SR);
  const dt=1/SR;
  function setSpec(s){ spec=s; resos=s.resonances.map(function(r){return new Reson(SR,r[0],r[1],r[2]);}); }
  function shake(v){ shakeAccum+=v; }
  function setTilt(v){ tilt=v; }
  function setReverb(v){ reverbMix=v; }
  function render(outL,outR,n){
    if(!spec){ for(let i=0;i<n;i++){outL[i]=0;outR[i]=0;} return; }
    const s=spec;
    systemE += shakeAccum*s.shakeGain; shakeAccum=0;
    const lat=tilt, mix=reverbMix;
    for(let i=0;i<n;i++){
      let v=(lat-bead)*s.slideStiff;
      if(v>s.slideMax) v=s.slideMax; else if(v<-s.slideMax) v=-s.slideMax;
      bead += v*dt;
      const slideMag=Math.abs(v)*(0.35+Math.abs(lat));
      systemE = systemE*s.systemDecay + slideMag*s.slideFeed;
      const p=s.density*systemE;
      const inject=(Math.random()<p)? systemE*s.collGain : 0;
      soundLvl = soundLvl*s.soundDecay + inject;
      const excit=soundLvl*gauss();
      let dry=0; for(let k=0;k<resos.length;k++) dry+=resos[k].process(excit);
      dry*=s.outGain; lp += (dry-lp)*s.lpCoef; dry=lp*MASTER;
      let pan=bead*0.5+0.5; if(pan<0)pan=0; else if(pan>1)pan=1;
      const lg=Math.sqrt(1-pan), rg=Math.sqrt(pan);
      const wl=rev.processL(dry), wr=rev.processR();
      const l=dry*lg*(1-mix)+wl*mix, r=dry*rg*(1-mix)+wr*mix;
      outL[i]=Math.tanh(l); outR[i]=Math.tanh(r);
    }
  }
  return {setSpec:setSpec, shake:shake, setTilt:setTilt, setReverb:setReverb, render:render};
}
</script>

<script>
/*INSTR_START*/
const INSTRUMENTS = [
  {id:"kayamb", name:"Kayamb", emoji:"🪘", accent:"#FF8A3D", accent2:"#FFD06B",
   spec:{systemDecay:0.9990,soundDecay:0.958,density:2.4,collGain:0.85,
     resonances:[[2350,0.74,1.0],[4500,0.60,0.45],[370,0.86,0.40]],
     outGain:2.4,lpCoef:0.42,slideStiff:8.0,slideMax:3.2,slideFeed:0.22,shakeGain:0.5}},
  {id:"maracas", name:"Maracas", emoji:"🪇", accent:"#FF7B33", accent2:"#FFC857",
   spec:{systemDecay:0.9985,soundDecay:0.950,density:1.7,collGain:0.9,
     resonances:[[3400,0.80,1.0],[6500,0.70,0.4]],
     outGain:2.5,lpCoef:0.6,slideStiff:8.0,slideMax:3.0,slideFeed:0.15,shakeGain:0.55}},
  {id:"cabasa", name:"Cabasa", emoji:"🥁", accent:"#00B4D8", accent2:"#90E0EF",
   spec:{systemDecay:0.9986,soundDecay:0.962,density:3.0,collGain:0.8,
     resonances:[[3000,0.56,1.0],[6200,0.55,0.7]],
     outGain:2.2,lpCoef:0.72,slideStiff:7.0,slideMax:3.0,slideFeed:0.2,shakeGain:0.5}},
  {id:"egg_shaker", name:"Egg Shaker", emoji:"🥚", accent:"#FF5DA2", accent2:"#FF9A8B",
   spec:{systemDecay:0.9983,soundDecay:0.948,density:1.9,collGain:0.85,
     resonances:[[4800,0.52,1.0],[820,0.82,0.4]],
     outGain:2.3,lpCoef:0.32,slideStiff:8.0,slideMax:2.8,slideFeed:0.16,shakeGain:0.5}},
  {id:"caxixi", name:"Caxixi", emoji:"🧺", accent:"#9D4EDD", accent2:"#E0AAFF",
   spec:{systemDecay:0.9982,soundDecay:0.942,density:2.0,collGain:0.9,
     resonances:[[3300,0.72,1.0],[7000,0.66,0.5]],
     outGain:2.4,lpCoef:0.55,slideStiff:8.0,slideMax:3.0,slideFeed:0.15,shakeGain:0.55}},
  {id:"tambourine", name:"Tambourin", emoji:"🔔", accent:"#FF4D6D", accent2:"#FFD23F",
   spec:{systemDecay:0.9986,soundDecay:0.955,density:2.2,collGain:0.7,
     resonances:[[2000,0.60,0.5],[7100,0.965,0.5],[9200,0.960,0.4]],
     outGain:1.9,lpCoef:0.8,slideStiff:7.0,slideMax:3.0,slideFeed:0.18,shakeGain:0.5}},
];
/*INSTR_END*/

// ── État ────────────────────────────────────────────────────────────────
let ctx=null, mode='';
let current=INSTRUMENTS[0], motionOk=false, invert=false;
let audioReady=false, shakeCount=0, lastErr='', wkOut=0;
let motionEvents=0, lastMag=0;
const isIOS = typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function';
const accelSign = isIOS ? 1 : -1;   // l'accéléromètre iOS est inversé vs Android

// rend createKayambDSP disponible sur le thread principal (pour le fallback)
try{ (0,eval)(document.getElementById('dsp-core').textContent); }catch(e){ lastErr='core:'+e.message; }

function dbg(){
  const el=document.getElementById('dbg'); if(!el) return;
  el.textContent = `son:${mode||'—'} · capteur:${motionOk?(motionEvents+'ev/'+lastMag.toFixed(1)):'off'} · ♪${shakeCount}`
    + (lastErr?(' · ⚠ '+lastErr):'');
}

// ── Déblocage audio SYNCHRONE (dans le geste — clé sur mobile/iOS) ───────
function unlockAudioSync(){
  if(!ctx){
    try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ lastErr='ctx:'+e.message; dbg(); return; }
  }
  // buffer muet : débloque la sortie audio iOS/Android dans le geste
  try{ const b=ctx.createBuffer(1,1,22050); const s=ctx.createBufferSource();
       s.buffer=b; s.connect(ctx.destination); s.start(0); }catch(e){}
  ctx.resume().catch(()=>{});
  dbg();
}

// ── Moteur audio par AudioBufferSource (même type de nœud que le bip) ────
// Les nœuds générateurs continus (Worklet/ScriptProcessor) restaient muets sur
// certains appareils, alors que les sources programmées (oscillateur) marchent.
// On pré-rend donc les sons avec le moteur DSP dans des AudioBuffers, et on les
// joue via AudioBufferSourceNode -> exactement comme le bip de test.
let master=null, revConv=null, revGain=null;
let hitBufs={}, slideBufs={}, slideSrc=null, slideGain=null, slidePan=null;
let beadPos=0, tiltTarget=0, slideLevel=0;

function makeImpulse(seconds, decay){
  const sr=ctx.sampleRate, n=Math.floor(seconds*sr);
  const buf=ctx.createBuffer(2,n,sr);
  for(let c=0;c<2;c++){ const d=buf.getChannelData(c);
    for(let i=0;i<n;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/n, decay); } }
  return buf;
}

function renderBuffer(spec, seconds, drive){
  const sr=ctx.sampleRate, n=Math.floor(seconds*sr);
  const dsp=createKayambDSP(sr); dsp.setSpec(spec); dsp.setReverb(0);
  const L=new Float32Array(n), R=new Float32Array(n);
  const blk=128, bl=new Float32Array(blk), br=new Float32Array(blk);
  for(let off=0; off<n; off+=blk){ const m=Math.min(blk,n-off);
    drive(dsp, off/sr); dsp.render(bl,br,m);
    L.set(bl.subarray(0,m),off); R.set(br.subarray(0,m),off); }
  const buf=ctx.createBuffer(2,n,sr); buf.copyToChannel(L,0); buf.copyToChannel(R,1);
  return buf;
}

function ensureBuffers(inst){
  if(!hitBufs[inst.id]){
    // une frappe = grosse impulsion d'énergie (le système est calibré pour le
    // glissement continu ; une frappe ponctuelle doit injecter beaucoup plus).
    const hits=[]; for(let v=0; v<4; v++)
      hits.push(renderBuffer(inst.spec, 0.45, function(dsp,t){ if(t===0) dsp.shake(1400); }));
    hitBufs[inst.id]=hits;
  }
  if(!slideBufs[inst.id])  // texture de glissement bouclable (tilt oscillant)
    slideBufs[inst.id]=renderBuffer(inst.spec, 3.0, function(dsp,t){ dsp.setTilt(Math.sin(t*5.0)*0.9); });
}

function rebuildSlide(inst){
  if(!master) return;
  if(slideSrc){ try{ slideSrc.stop(); }catch(e){} try{ slideSrc.disconnect(); }catch(e){} slideSrc=null; }
  ensureBuffers(inst);
  slideSrc=ctx.createBufferSource(); slideSrc.buffer=slideBufs[inst.id]; slideSrc.loop=true;
  slideGain=ctx.createGain(); slideGain.gain.value=0;
  slidePan=ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  slideSrc.connect(slideGain);
  if(slidePan){ slideGain.connect(slidePan); slidePan.connect(master); slidePan.connect(revGain); }
  else { slideGain.connect(master); slideGain.connect(revGain); }
  slideSrc.start();
}

function playHit(intensity){
  if(!master) return;
  ensureBuffers(current);
  const bufs=hitBufs[current.id]; const buf=bufs[(Math.random()*bufs.length)|0];
  const src=ctx.createBufferSource(); src.buffer=buf;
  src.playbackRate.value = 0.94 + 0.16*intensity + (Math.random()-0.5)*0.06;
  const g=ctx.createGain(); g.gain.value = 0.3 + 0.7*intensity;
  src.connect(g); g.connect(master); g.connect(revGain);
  src.start();
  wkOut = g.gain.value; // pour l'indicateur
}

async function startAudio(){
  if(audioReady) return;
  master = ctx.createGain(); master.gain.value=1.0; master.connect(ctx.destination);
  revConv = ctx.createConvolver(); revConv.buffer = makeImpulse(1.6, 2.2);
  revGain = ctx.createGain(); revGain.gain.value = parseFloat(document.getElementById('rev').value)*0.5;
  revConv.connect(ctx.destination); revGain.connect(revConv);
  rebuildSlide(current);
  audioReady=true; mode='buffers';
  await ctx.resume();
  dbg();
}

// met à jour le glissement (gain + pan) selon l'inclinaison — appelé chaque frame
function updateSlide(dt){
  if(!slideGain) return;
  let v=(tiltTarget-beadPos)*8.0; if(v>3.2)v=3.2; else if(v<-3.2)v=-3.2;
  beadPos += v*dt;
  const tgt = Math.min(1, Math.abs(v)*(0.35+Math.abs(tiltTarget))*0.6);
  slideLevel += (tgt - slideLevel)*Math.min(1, dt*9);
  slideGain.gain.value = slideLevel*0.7;
  if(slidePan){ let p=beadPos; if(p<-1)p=-1; else if(p>1)p=1; slidePan.pan.value=p; }
  wkOut = Math.max(wkOut*0.9, slideLevel);
}

// bip de test : oscillateur direct (sans worklet) -> isole le souci device vs worklet
function testBeep(){
  unlockAudioSync();
  if(!ctx){ return; }
  ctx.resume().catch(()=>{});
  try{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=440; o.type='sine';
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.45);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.5);
  }catch(e){ lastErr='beep:'+e.message; }
  dbg();
}

function setInstrument(inst){
  current=inst;
  if(audioReady) rebuildSlide(inst);
  document.documentElement.style.setProperty('--accent', inst.accent);
  document.documentElement.style.setProperty('--accent2', inst.accent2);
  document.getElementById('instName').textContent = inst.name;
  document.getElementById('instName').style.color = inst.accent2;
  stageSetInstrument(inst);
  buildCards();
}
function doShake(intensity){
  if(ctx && ctx.state!=='running') ctx.resume().catch(()=>{});
  if(audioReady){ playHit(intensity); shakeCount++; }
  else lastErr='audio pas prêt';
  stageBurst(intensity);
  if(navigator.vibrate) navigator.vibrate(14);
  dbg();
}

// ── Capteur de mouvement (= ShakeDetector.kt) ───────────────────────────
let gx=0,gy=0,gz=0,gInit=false, armed=true, lastShake=0, threshold=12;
const maxLinear=42;
function applySensitivity(s){ threshold = 22 - s*16; }
function onMotion(e){
  motionEvents++;
  let a=e.accelerationIncludingGravity, hasGrav=true;
  if(!a || (a.x==null && a.y==null && a.z==null)){ a=e.acceleration; hasGrav=false; }
  if(!a || (a.x==null && a.y==null && a.z==null)){ lastErr='accel null'; if(motionEvents%10===0)dbg(); return; }
  if(lastErr==='accel null') lastErr='';
  const vx=a.x||0, vy=a.y||0, vz=a.z||0;
  if(hasGrav){
    if(!gInit){ gx=vx; gy=vy; gz=vz; gInit=true; return; }
    const al=0.82; gx=al*gx+(1-al)*vx; gy=al*gy+(1-al)*vy; gz=al*gz+(1-al)*vz;
  }
  const lx=vx-(hasGrav?gx:0), ly=vy-(hasGrav?gy:0), lz=vz-(hasGrav?gz:0);
  const gmag=hasGrav ? (Math.sqrt(gx*gx+gy*gy+gz*gz)||9.81) : 9.81;
  const unit=9.81/gmag;                          // -> m/s² même si valeurs en g
  const mag=Math.sqrt(lx*lx+ly*ly+lz*lz)*unit;
  lastMag=mag;
  document.getElementById('meterFill').style.width = Math.min(100, mag/maxLinear*100)+'%';

  if(hasGrav){
    let lat = accelSign*gx/gmag; if(lat<-1)lat=-1; else if(lat>1)lat=1;
    if(invert) lat=-lat;
    tiltTarget = lat; stageSetTilt(lat);
  }
  const now=performance.now();
  if(armed && mag>=threshold && now-lastShake>=60){
    armed=false; lastShake=now;
    let intensity=(mag-threshold*0.5)/(maxLinear-threshold*0.5);
    intensity=Math.max(0.12, Math.min(1, intensity));
    doShake(intensity);
  } else if(!armed && mag<threshold*0.55){ armed=true; }
  if(motionEvents%10===0) dbg();
}

// ── Vue animée (= InstrumentStageView.kt) ───────────────────────────────
const canvas=document.getElementById('stage'); const g=canvas.getContext('2d');
let accent='#FF8A3D', accent2='#FFD06B', emoji='🪘';
let phase=0, pulse=0, tilt=0, lastTilt=0, lastFrame=0;
let ripples=[], particles=[];
function stageSetInstrument(inst){ accent=inst.accent; accent2=inst.accent2; emoji=inst.emoji; }
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
function lighten(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
  r=r+(255-r)*f|0; gg=gg+(255-gg)*f|0; b=b+(255-b)*f|0; return `rgb(${r},${gg},${b})`;}
function darken(hex,f){const n=parseInt(hex.slice(1),16);return `rgb(${((n>>16)&255)*f|0},${((n>>8)&255)*f|0},${(n&255)*f|0})`;}
function discR(){return Math.min(canvas.width,canvas.height)/dpr*0.20;}
let dpr=1;
function resize(){ dpr=window.devicePixelRatio||1;
  canvas.width=canvas.clientWidth*dpr; canvas.height=canvas.clientHeight*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);

function stageBurst(intensity){
  const W=canvas.clientWidth, H=canvas.clientHeight;
  const cx=W*0.5+tilt*W*0.06, cy=H*0.46, r=discR();
  pulse=Math.min(1,pulse+0.6+0.4*intensity);
  ripples.push({r:r*0.9, max:r*(2.0+1.4*intensity), life:1, w:6+10*intensity});
  const count=(6+intensity*24)|0;
  for(let i=0;i<count;i++){
    const ang=Math.random()*6.2832, sp=r*(1.6+2.6*intensity)*(0.5+Math.random()*0.8);
    const cc=[accent,accent2,'#FFFFFF'][Math.random()*3|0];
    particles.push({x:cx+Math.cos(ang)*r*0.7, y:cy+Math.sin(ang)*r*0.7,
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:1, lifeMax:0.5+Math.random()*0.4,
      size:3+Math.random()*(4+5*intensity), color:cc});
  }
}
function stageSetTilt(lat){
  tilt=lat; const move=lat-lastTilt;
  if(Math.abs(move)>0.012){
    const W=canvas.clientWidth, H=canvas.clientHeight;
    const cx=W*0.5+tilt*W*0.06, cy=H*0.46, r=discR(), dir=lat>=0?1:-1;
    const count=Math.max(1,Math.min(4,(Math.abs(move)*60)|0));
    for(let i=0;i<count;i++){
      particles.push({x:cx+(Math.random()-0.5)*r, y:cy+(Math.random()-0.5)*r*0.7,
        vx:dir*r*(0.6+Math.random()*0.8), vy:(Math.random()-0.3)*r*0.4,
        life:1, lifeMax:0.4+Math.random()*0.3, size:2.5+Math.random()*3,
        color: Math.random()<0.5?accent2:'#FFFFFF'});
    }
  }
  lastTilt=lat;
}
function frame(now){
  let dt=(now-lastFrame)/1000; lastFrame=now;
  if(dt<=0||dt>0.1) dt=0.016;
  if(audioReady) updateSlide(dt);
  phase+=dt*1.6; pulse=Math.max(0,pulse-dt*2.6);
  const W=canvas.clientWidth, H=canvas.clientHeight;
  g.clearRect(0,0,W,H);
  const cx=W*0.5+tilt*W*0.06, cy=H*0.46;
  const breathe=1+0.025*Math.sin(phase);
  const r=discR()*(breathe+pulse*0.14);

  // glow
  const glowR=r*(2.4+pulse*0.8), ga=Math.min(0.85,0.16+pulse*0.6);
  let gr=g.createRadialGradient(cx,cy,0,cx,cy,glowR);
  gr.addColorStop(0,hexA(accent,ga)); gr.addColorStop(0.5,hexA(accent2,ga*0.33)); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,glowR,0,6.2832); g.fill();

  // ripples
  for(let i=ripples.length-1;i>=0;i--){ const rp=ripples[i];
    rp.life-=dt/0.6; rp.r+=(rp.max-rp.r)*Math.min(1,dt*3.2);
    if(rp.life<=0){ ripples.splice(i,1); continue; }
    g.strokeStyle=hexA(accent2,rp.life*0.7); g.lineWidth=rp.w*rp.life;
    g.beginPath(); g.arc(cx,cy,rp.r,0,6.2832); g.stroke();
  }

  // disc
  let dg=g.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r*1.5);
  dg.addColorStop(0,lighten(accent2,0.35)); dg.addColorStop(0.55,accent); dg.addColorStop(1,darken(accent,0.55));
  g.fillStyle=dg; g.beginPath(); g.arc(cx,cy,r,0,6.2832); g.fill();
  g.strokeStyle='rgba(255,255,255,0.23)'; g.lineWidth=2; g.beginPath(); g.arc(cx,cy,r,0,6.2832); g.stroke();

  // emoji
  g.font=`${r*1.05}px -apple-system,"Segoe UI Emoji",sans-serif`;
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(emoji,cx,cy);

  // particles
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i];
    p.life-=dt/p.lifeMax; if(p.life<=0){ particles.splice(i,1); continue; }
    p.vx*=(1-dt*1.6); p.vy=p.vy*(1-dt*1.6)+dt*220; p.x+=p.vx*dt; p.y+=p.vy*dt;
    g.fillStyle=hexA(p.color,p.life); g.beginPath(); g.arc(p.x,p.y,p.size*p.life,0,6.2832); g.fill();
  }
  requestAnimationFrame(frame);
}

// ── Cartes ──────────────────────────────────────────────────────────────
function buildCards(){
  const box=document.getElementById('cards'); box.innerHTML='';
  INSTRUMENTS.forEach(function(inst){
    const sel=inst.id===current.id;
    const c=document.createElement('div'); c.className='card'+(sel?' sel':'');
    if(sel){ c.style.borderColor=inst.accent2;
      c.style.background=`linear-gradient(135deg, ${hexA(inst.accent,0.32)}, ${hexA(inst.accent2,0.16)})`; }
    c.innerHTML=`<div class="e">${inst.emoji}</div><div class="n">${inst.name}</div>`;
    c.onclick=function(){ setInstrument(inst); doShake(0.6); };
    box.appendChild(c);
  });
}

// ── Démarrage (geste utilisateur obligatoire iOS) ───────────────────────
document.getElementById('startBtn').addEventListener('click', async function(){
  unlockAudioSync();                       // 1) débloquer l'audio DANS le geste
  try{
    if(isIOS){ const res=await DeviceMotionEvent.requestPermission(); motionOk=(res==='granted'); }
    else motionOk=true;
  }catch(err){ motionOk=false; lastErr='perm:'+err.message; }
  // 2) moteur audio par AudioBufferSource (comme le bip — marche partout)
  try{ await startAudio(); }
  catch(err){ lastErr='eng:'+err.message; document.getElementById('tagline').textContent='Audio: '+err.message; }
  if(motionOk) window.addEventListener('devicemotion', onMotion, true);
  else document.getElementById('tagline').textContent='Capteur refusé — touche le disque pour jouer';
  document.getElementById('overlay').style.display='none';
  dbg();
});

// filet de sécurité : tout toucher relance le contexte s'il s'est suspendu
window.addEventListener('pointerdown', function(){ if(ctx && ctx.state!=='running') ctx.resume().catch(()=>{}); }, true);
document.getElementById('testBtn').addEventListener('click', testBeep);
document.getElementById('engineBtn').style.display='none';

// touche le disque = secousse (test / sans capteur)
canvas.addEventListener('pointerdown', function(){ unlockAudioSync(); doShake(0.7); });
document.getElementById('sens').addEventListener('input', function(e){ applySensitivity(parseFloat(e.target.value)); });
document.getElementById('rev').addEventListener('input', function(e){ if(revGain) revGain.gain.value=parseFloat(e.target.value)*0.5; });
document.getElementById('invertBtn').addEventListener('click', function(){ invert=!invert;
  this.style.color = invert ? 'var(--accent2)' : 'var(--dim)'; });

// init
resize(); buildCards(); applySensitivity(0.55); lastFrame=performance.now(); requestAnimationFrame(frame);
dbg(); setInterval(dbg, 500);
</script>
